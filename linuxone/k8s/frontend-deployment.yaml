apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraguard-frontend
  namespace: terraguard-ai
  labels:
    app: terraguard-frontend
    tier: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: terraguard-frontend
  template:
    metadata:
      labels:
        app: terraguard-frontend
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["s390x", "amd64"]
      containers:
        - name: frontend
          image: image-registry.openshift-image-registry.svc:5000/terraguard-ai/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: terraguard-ai
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: terraguard-frontend
