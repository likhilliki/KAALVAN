version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: terraguard-db
    restart: always
    environment:
      POSTGRES_DB: terraguard_db
      POSTGRES_USER: terraguard
      POSTGRES_PASSWORD: terraguard_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terraguard -d terraguard_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: terraguard-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://terraguard:terraguard_secure_password@db:5432/terraguard_db
      PORT: 8000
      HOST: 0.0.0.0
      ENVIRONMENT: production
      NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY:-}
      CORS_ORIGINS: "*"
      IS_LINUXONE: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: terraguard-frontend
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
